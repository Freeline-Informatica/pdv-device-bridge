[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdv-device-bridge"
version = "0.1.0"
description = "Bridge serial LAN para balancas e impressoras ESC/POS no Raspberry Pi"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pyserial>=3.5,<4.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
]

[project.scripts]
pdv-device-bridge = "pdv_device_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdv_device_bridge*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
