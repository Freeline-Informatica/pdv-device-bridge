[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdv-device-bridge"
version = "0.2.0"
description = "Bridge serial LAN para balancas e impressoras ESC/POS no Raspberry Pi"
requires-python = ">=3.11,<3.15"
dependencies = [
  "cryptography>=43.0.0,<47.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "packaging>=24.0,<27.0",
  "pyserial>=3.5,<4.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
]

[project.scripts]
pdv-device-bridge = "pdv_device_bridge.__main__:main"
pdv-device-agent = "pdv_device_bridge.control_agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdv_device_bridge*"]
exclude = ["tests*"]

[tool.setuptools.data-files]
"share/pdv-device-bridge" = ["config.example.toml", "agent.example.toml"]
"share/pdv-device-bridge/systemd" = ["systemd/pdv-device-bridge.service", "systemd/pdv-device-agent.service"]
"share/pdv-device-bridge/avahi" = ["avahi/pdv-device-bridge.service"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
